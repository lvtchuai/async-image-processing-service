apiVersion: v1
kind: Secret
metadata:
  name: pixelpipe-config
type: Opaque
stringData:
  QUEUE_NAME: {{ .Values.config.queue | quote }}
{{- if .Values.cloud.enabled }}
  # CLOUD: trỏ RDS / Amazon MQ / S3 (giá trị truyền qua --set lúc deploy)
  DATABASE_URL:  {{ .Values.cloud.databaseUrl | quote }}
  RABBITMQ_URL:  {{ .Values.cloud.rabbitmqUrl | quote }}
  S3_ENDPOINT:   {{ .Values.cloud.s3Endpoint | quote }}    # "" -> boto3 dùng endpoint AWS mặc định
  S3_ACCESS_KEY: {{ .Values.cloud.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.cloud.s3SecretKey | quote }}
  S3_BUCKET:     {{ .Values.cloud.s3Bucket | quote }}
  S3_REGION:     {{ .Values.cloud.s3Region | quote }}
{{- else }}
  # LOCAL: infra in-cluster
  DATABASE_URL:  "postgresql+psycopg2://{{ .Values.postgres.auth.user }}:{{ .Values.postgres.auth.password }}@postgres:5432/{{ .Values.postgres.auth.db }}"
  RABBITMQ_URL:  "amqp://guest:guest@rabbitmq:5672/"
  S3_ENDPOINT:   "http://minio:9000"
  S3_ACCESS_KEY: {{ .Values.minio.auth.user | quote }}
  S3_SECRET_KEY: {{ .Values.minio.auth.password | quote }}
  S3_BUCKET:     {{ .Values.config.bucket | quote }}
  S3_REGION:     "us-east-1"
{{- end }}