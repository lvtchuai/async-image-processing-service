apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # replicas: {{ .Values.worker.replicas }}
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image }}:{{ .Values.worker.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: pixelpipe-config }
          ports:
            - { containerPort: 9100, name: metrics }
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels: { app: worker }
spec:
  selector: { app: worker }
  ports:
    - { name: metrics, port: 9100, targetPort: 9100 }