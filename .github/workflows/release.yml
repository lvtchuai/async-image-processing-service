name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write        # để push GHCR bằng GITHUB_TOKEN (không cần secret)

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api,    context: apps/api }
          - { name: worker, context: apps/worker }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pixelpipe-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pixelpipe-${{ matrix.name }}:latest